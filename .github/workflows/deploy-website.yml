name: Deploy website to Fasthosts

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: fasthosts-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: fasthosts-production
      url: https://pheme24.online/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: |
          node scripts/build-editions.mjs --check
          python3 -m unittest discover -s scripts -p 'test_native_articles.py'
          python3 -m unittest discover -s scripts -p 'test_publisher_reader.py'
          python3 -m unittest discover -s scripts -p 'test_phemica_input.py'
          python3 -m unittest discover -s scripts -p 'test_corroboration.py'
          python3 -m unittest discover -s scripts -p 'test_octal_engine.py'
          python3 -m unittest discover -s scripts -p 'test_primary_costs.py'
          python3 -m unittest discover -s scripts -p 'test_resource_graph.py'
          python3 -m unittest discover -s scripts -p 'test_resource_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_resource_scenario.py'
          node --check assets/app.js
          node --check assets/resource-graph.js
          node --test scripts/test-evidence-bot.cjs
          node --check scripts/scrape-indian-express.mjs
          python3 scripts/update-markets.py --check
          node --check assets/data.js
          python3 -m py_compile scripts/deploy-website.py scripts/verify-website.py scripts/collect-feeds.py scripts/make-edition.py scripts/story_images.py scripts/build-audio.py scripts/build-publisher-feeds.py scripts/collect-company-markets.py scripts/build-static-news.py scripts/build-company-directory.py scripts/build-publisher-reader.py backend/server.py backend/corroboration.py backend/octal_engine.py backend/primary_costs.py backend/resource_graph.py backend/resource_evidence.py backend/resource_scenario.py
          mkdir -p build/static-verify
          cp index.html build/static-verify/
          python3 scripts/build-static-news.py build/static-verify
          grep -q 'Latest edition headlines' build/static-verify/index.html
          grep -q 'property="og:title"' build/static-verify/stories/*/index.html
          test -s build/static-verify/sitemap.xml
          python3 scripts/build-publisher-reader.py --feed assets/publisher-feeds.json --out build/static-verify/reader-cache
          test -s build/static-verify/reader-cache/index.json
          python3 -m backend.phemica_input --reader build/static-verify/reader-cache/index.json --events feeds/phemica-plan-events.json --out build/static-verify/api/phemica/v1/input.json --revision "$GITHUB_SHA"
      - name: Cache generated narration audio
        uses: actions/cache@v4
        with:
          path: .audio-cache
          key: pheme-audio-${{ hashFiles('editions/*.json', 'scripts/build-audio.py') }}
          restore-keys: |
            pheme-audio-
      - name: Install neural TTS runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --quiet --upgrade 'edge-tts>=7.3.0' kokoro-onnx
      - name: Build the public site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PHEME_ELEVENLABS_MODEL: eleven_multilingual_v2
        run: |
          # Generate a fresh source feed for the initial deploy as well as scheduled updates.
          python3 scripts/build-publisher-feeds.py
          rm -rf build/site
          mkdir -p build/site/api
          cp index.html build/site/
          cp -R assets build/site/
          python3 scripts/build-publisher-reader.py --out build/site/assets/reader-cache
          test -s build/site/assets/reader-cache/index.json
          python3 -m backend.phemica_input --reader build/site/assets/reader-cache/index.json --events feeds/phemica-plan-events.json --out build/site/api/phemica/v1/input.json --revision "$GITHUB_SHA"
          python3 scripts/build-static-news.py build/site
          cp -R api/. build/site/api/
          node scripts/scrape-indian-express.mjs build/site/assets/indian-express
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "Generating all Pheme narration using ElevenLabs Multilingual v2."
            PHEME_TTS_PROVIDER=elevenlabs PHEME_TTS_STRICT=1 python3 scripts/build-audio.py --out build/site/assets/audio --cache .audio-cache --concurrency 4
          else
            echo "::warning::ELEVENLABS_API_KEY is not configured; retaining existing free narration until a key is added."
            PHEME_TTS_PROVIDER=edge python3 scripts/build-audio.py --out build/site/assets/audio --cache .audio-cache --concurrency 14
          fi
          sed -i "s|<meta name=\"daybreak-build\" content=\"dev\">|<meta name=\"daybreak-build\" content=\"$GITHUB_SHA\">|" build/site/index.html
          sed -i "s|?v=dev|?v=$GITHUB_SHA|g" build/site/index.html
          grep -q "content=\"$GITHUB_SHA\"" build/site/index.html
          grep -q "assets/data.js?v=$GITHUB_SHA" build/site/index.html
          grep -q "assets/app.js?v=$GITHUB_SHA" build/site/index.html
          find build/site -type f | sort
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on main; skipping this deployment.'
          fi
      - name: Upload and publish
        if: steps.current.outputs.deploy == 'true'
        env:
          FASTHOSTS_FTP_PASSWORD: ${{ secrets.FASTHOSTS_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: python3 scripts/deploy-website.py
      - name: Verify the public website
        if: steps.current.outputs.deploy == 'true'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 scripts/verify-website.py
