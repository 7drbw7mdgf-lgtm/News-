name: Build a keyless Pheme edition

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'
      timezone: Europe/London
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-writer-trial.yml'
      - 'scripts/make-edition.py'
      - 'scripts/local_writer.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/local-writer-trial.yml'
      - 'scripts/make-edition.py'
      - 'scripts/local_writer.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated edition to Fasthosts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pheme-local-writer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  edition:
    if: |
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PHEME_LOCAL_WRITER: '1'
      LLAMA_RELEASE: b12676
      LLAMA_SHA256: c65369a8574d096d90c593fef0e77a1ba2abfdfa7e7e9426bbf8939781ef8a07
      MODEL_REVISION: ae44f08e1392f39c0e474af10c3ff8355c8b6688
      CHECKER_REVISION: 6bc2a55c7c0f7e2bc68de60bb248e523e2612abb
      MODEL_SHA256: 2fde00ce69dd4899c70d020845e2638353015bba0fdf161b3eb965f2bca4464e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check article filtering
        run: python -m unittest discover -s scripts -p 'test_local_writer.py'
      - name: Collect fresh publisher feeds
        run: python3 scripts/collect-feeds.py > "${RUNNER_TEMP}/candidates.json"
      - name: Download and verify the model and runner
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/llama.tar.gz"
          model="${RUNNER_TEMP}/pheme.gguf"
          curl -fsSL --retry 2 --max-time 240 -o "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/llama-${LLAMA_RELEASE}-bin-ubuntu-x64.tar.gz"
          curl -fsSL --retry 2 --max-time 240 -o "$model" \
            "https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/${MODEL_REVISION}/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          printf '%s  %s\n' "$LLAMA_SHA256" "$archive" "$MODEL_SHA256" "$model" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/llama"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/llama" --no-same-owner
      - name: Install the source checker
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'onnxruntime==1.23.2' 'tokenizers==0.22.1'
          cd "$RUNNER_TEMP"
          url="https://huggingface.co/Xenova/nli-deberta-v3-small/resolve/${CHECKER_REVISION}"
          curl -fsSL --retry 2 --max-time 180 -o model_quantized.onnx "$url/onnx/model_quantized.onnx"
          curl -fsSL --retry 2 --max-time 120 -o tokenizer.json "$url/tokenizer.json"
          sha256sum -c <<'SUMS'
          4edae6adf6ef735d3983a052113e8a235da2e9ac6a6cadf33f3fc088117e6051  model_quantized.onnx
          a86f883318afa11c8c10466f1bf4efaeb6ded28a52cbe57217a8fa0d0a2a87df  tokenizer.json
          SUMS
          echo "PHEME_SOURCE_CHECKER=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Generate and validate a draft edition
        shell: bash
        run: |
          server="$(find "${RUNNER_TEMP}/llama" -type f -name llama-server -print -quit)"
          test -n "$server"
          export LD_LIBRARY_PATH="$(dirname "$server")${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          "$server" --model "${RUNNER_TEMP}/pheme.gguf" --alias pheme-local \
            --host 127.0.0.1 --port 8087 --threads 4 --ctx-size 4096 --parallel 1 \
            > "${RUNNER_TEMP}/llama.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=
          for attempt in {1..45}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8087/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 2
          done
          if [ -z "$ready" ]; then
            tail -40 "${RUNNER_TEMP}/llama.log"
            exit 1
          fi
          set -o pipefail
          { time python3 scripts/make-edition.py "${RUNNER_TEMP}/candidates.json"; } 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/build-editions.mjs
          node scripts/build-editions.mjs --check

      - name: Stage the validated edition for publishing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
        shell: bash
        run: |
          mapfile -t editions < <(git ls-files -mo --exclude-standard -- editions/)
          if [[ "${#editions[@]}" -ne 1 || ! "${editions[0]:-}" =~ ^editions/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
            echo "::error::Expected exactly one new or updated edition."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/validated-edition"
          cp -- "${editions[0]}" "$RUNNER_TEMP/validated-edition/"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
        with:
          name: validated-pheme-edition
          path: ${{ runner.temp }}/validated-edition/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: edition
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: validated-pheme-edition
          path: ${{ runner.temp }}/validated-edition
      - name: Install and validate the edition
        shell: bash
        run: |
          shopt -s nullglob
          drafts=("$RUNNER_TEMP/validated-edition/"*.json)
          draft="${drafts[0]:-}"
          edition="${draft##*/}"
          if [[ "${#drafts[@]}" -ne 1 || ! "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
            echo "::error::Expected exactly one dated edition in the validated artifact."
            exit 1
          fi
          latest="$(find editions -maxdepth 1 -name '*.json' -printf '%f\n' | sort | tail -1)"
          if [[ "$edition" < "$latest" || "$edition" != "$(TZ=Europe/London date +%F).json" ]]; then
            echo "::error::The validated edition is stale."
            exit 1
          fi
          cp -- "${drafts[0]}" "editions/$edition"
          node scripts/build-editions.mjs
          node scripts/build-editions.mjs --check
      - name: Commit the edition
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- editions assets/data.js
          if git diff --cached --quiet; then
            echo 'This edition is already published.'
            exit 0
          fi
          git commit -m "Keyless edition $(TZ=Europe/London date '+%Y-%m-%d %H:%M') [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 3
          done
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
      - name: Publish on Fasthosts
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-website.yml --ref main
