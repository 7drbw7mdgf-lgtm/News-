name: Refresh Pheme market charts

on:
  schedule:
    - cron: '35 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pheme-markets
  cancel-in-progress: false

jobs:
  markets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect completed daily candles
        run: python3 scripts/update-markets.py
      - name: Collect ECB foreign exchange reference rates
        run: python3 scripts/update-forex.py
      - name: Collect licensed company data (publishes nothing unless the licence flag is approved)
        env:
          PHEME_MARKET_DATA_PUBLIC_DISPLAY: ${{ vars.PHEME_MARKET_DATA_PUBLIC_DISPLAY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 scripts/collect-company-markets.py
      - name: Validate market data
        run: |
          python3 scripts/update-markets.py --check
          python3 scripts/update-forex.py --check
          python3 scripts/check-economic-calendar.py
      - name: Commit updated charts and profiles
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/markets.json assets/company-market-data.json
          if [ -f assets/forex.json ]; then git add assets/forex.json; fi
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m "Refresh daily market charts and FX rates [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo 'pushed=true' >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Publish the charts
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-website.yml --ref main
