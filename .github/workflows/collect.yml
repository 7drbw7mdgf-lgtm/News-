name: Collect Daybreak candidates

on:
  schedule:
    - cron: '15 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect feeds
        run: python3 scripts/collect-feeds.py > candidates.json
      - name: Summarise the collection
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('candidates.json'))
          groups = d['candidateGroups']
          items = sum(len(g) for g in groups)
          outlets = {i['outlet'] for g in groups for i in g}
          multi = sum(1 for g in groups if len({i['outlet'] for i in g}) > 1)
          print(f"Feeds: {d['feedCount']} · failed: {len(d['feedErrors'])} · articles (last 2 days): {items} · outlets with articles: {len(outlets)} · headline groups: {len(groups)} · groups covered by 2+ outlets: {multi}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daybreak-candidates
          path: candidates.json
          retention-days: 7
