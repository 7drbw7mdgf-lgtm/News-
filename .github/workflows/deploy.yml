name: Deploy to Fasthosts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fasthosts-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site over FTP
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Validate edition and JavaScript
        run: |
          node scripts/build-editions.mjs --check
          node --check assets/app.js

      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Sync files to Fasthosts
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            scripts/**
            editions/**
